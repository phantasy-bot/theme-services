<!doctype html>
<html lang="{{site.language}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{site.title}}</title>
    <meta name="description" content="{{site.description}}">
    {{#if site.favicon}}<link rel="icon" href="{{site.favicon}}">{{/if}}
    <link rel="stylesheet" href="/theme-assets/style.css">
    <style>:root { --theme-accent: {{theme.accentColor}}; }</style>
    {{{customHead}}}
    {{#if customCss}}<style>{{{customCss}}}</style>{{/if}}
  </head>
  <body>
    <div class="shell">
      <header class="siteHeader">
        <div>
          <a href="/" class="siteBrand">{{site.title}}</a>
          <p class="siteTagline">{{site.description}}</p>
        </div>
        <nav class="siteNav">
          {{#each nav}}
            <a href="{{href}}"{{#if external}} target="_blank" rel="noopener"{{/if}}>{{label}}</a>
          {{/each}}
        </nav>
      </header>
      <main class="siteMain">{{{body}}}</main>
      <footer class="siteFooter">
        <span>{{agent.name}}</span>
        <span>Powered by Phantasy</span>
      </footer>
    </div>
  </body>
</html>
